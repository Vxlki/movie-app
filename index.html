<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filme">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Filmele mele</title>
<style>
:root{
  --bg:#14111c; --s1:#1d1928; --s2:#282236; --s3:#352d47; --line:#2f2840;
  --tx:#f3eff8; --mu:#a39cb3; --mu2:#7a7290;
  --gold:#ffc440; --rose:#e8506f; --ok:#4cc38a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + var(--safe-b));min-height:100vh;touch-action:manipulation}
html.lock,html.lock body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font-size:16px}
a{color:var(--gold)}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:rgba(20,17,28,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:calc(var(--safe-t) + 10px) 16px 10px;border-bottom:1px solid var(--line)}
.top h1{margin:0 0 10px;font-size:28px;letter-spacing:-.02em}
.seg{display:flex;background:var(--s1);border-radius:11px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:7px 8px;border-radius:9px;font-size:13.5px;color:var(--mu);font-weight:600}
.seg button.on{background:var(--s3);color:var(--tx)}
.seg .n{opacity:.6;font-weight:500;margin-left:4px}
.tools{display:flex;gap:8px;margin-top:10px}
.field{flex:1;background:var(--s1);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:none;min-width:0}
.field:focus{border-color:var(--s3)}
select.field{flex:0 0 auto;-webkit-appearance:none;appearance:none;padding-right:12px}

/* lists */
.wrap{padding:8px 16px 24px}
.group{margin:18px 2px 8px;font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;margin:8px 0;background:var(--s1);border-radius:var(--r);cursor:pointer}
.card:active{background:var(--s2)}
.poster{width:56px;height:84px;border-radius:8px;object-fit:cover;background:var(--s3);flex:0 0 auto}
.poster.big{width:104px;height:156px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.poster.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mu);font-size:18px;
  background:linear-gradient(160deg,var(--s3),var(--s2))}
.poster.big.ph{font-size:32px}
.meta{flex:1;min-width:0}
.t{font-weight:650;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{font-size:13px;color:var(--mu);margin-top:3px}
.note{font-size:13px;color:var(--mu2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{flex:0 0 auto;min-width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:17px;background:rgba(255,196,64,.12);color:var(--gold)}
.score.none{background:var(--s2);color:var(--mu2);font-size:13px;font-weight:600}
.bar{height:5px;background:var(--s3);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.pill{flex:0 0 auto;padding:8px 11px;border-radius:10px;background:var(--s2);font-size:13px;font-weight:700;white-space:nowrap}
.pill.go{background:rgba(76,195,138,.15);color:var(--ok)}
.empty{text-align:center;color:var(--mu);padding:48px 24px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;background:var(--s2);font-weight:650}
.btn.pri{background:var(--gold);color:#241a05}
.btn.ok{background:var(--ok);color:#06210f}
.btn.danger{background:rgba(232,80,111,.14);color:var(--rose)}
.btn.block{display:flex;width:100%}
.banner{display:flex;align-items:center;gap:10px;margin:12px 0 4px;padding:12px;border-radius:var(--r);background:rgba(255,196,64,.1);border:1px solid rgba(255,196,64,.25);font-size:14px}
.banner .meta{color:var(--tx)}
.banner .x{color:var(--mu);padding:4px 6px;font-size:18px}

/* search grid */
.more{text-align:center;margin:20px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin-top:12px}
.tile{text-align:left;position:relative;cursor:pointer}
.tile .poster{width:100%;height:auto;aspect-ratio:2/3;border-radius:10px}
.tile .tt{font-size:13px;font-weight:600;margin-top:5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .ty{font-size:12px;color:var(--mu)}
.tag{position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;background:rgba(20,17,28,.85)}
.tag.in{background:var(--ok);color:#06210f}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(20,17,28,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mu2);padding:4px 0}
nav.tabs button.on{color:var(--gold)}
nav.tabs svg{width:24px;height:24px}

/* sheet (detalii) */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.open{transform:none}
.hero{position:relative;min-height:calc(190px + var(--safe-t));background:var(--s1) center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,28,.3) 0%,rgba(20,17,28,.55) 50%,var(--bg) 100%)}
.close{position:absolute;z-index:2;top:calc(var(--safe-t) + 10px);left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);font-size:18px;display:flex;align-items:center;justify-content:center}
.back{position:absolute;z-index:3;top:calc(var(--safe-t) + 12px);left:12px;display:flex;align-items:center;gap:2px;padding:8px 16px 8px 8px;
  border-radius:22px;background:rgba(20,17,28,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:700;font-size:16px;color:var(--tx);
  border:1px solid rgba(255,255,255,.12)}
.back svg{width:22px;height:22px}
.back.inline{position:static;margin-bottom:10px}
.grab{position:absolute;z-index:3;top:calc(var(--safe-t) + 5px);left:50%;transform:translateX(-50%);width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.4)}
.sbar{position:fixed;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 8px) 12px 8px;
  background:rgba(20,17,28,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transform:translateY(-110%);transition:transform .2s}
.sbar.on{transform:none}
.sbar .back{position:static;background:var(--s2)}
.sbt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.head{position:relative;z-index:2;display:flex;gap:14px;align-items:flex-end;padding:0 16px;margin-top:-96px}
.head h2{margin:0;font-size:22px;line-height:1.2;letter-spacing:-.01em}
.head .orig{color:var(--mu);font-size:14px;margin-top:2px}
.head .sub{margin-top:6px}
.body{padding:16px 16px calc(40px + var(--safe-b))}
.ov{color:#d6d0e2;font-size:15px;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ov.open{-webkit-line-clamp:unset;display:block}
.sec{margin-top:22px}
.sec h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:8px 12px;border-radius:10px;background:var(--s1);font-weight:650;font-size:14px;color:var(--mu)}
.chips button.on{background:var(--s3);color:var(--tx)}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{height:40px;border-radius:9px;background:var(--s1);font-weight:750;color:var(--mu)}
.rate button.fill{background:rgba(255,196,64,.18);color:var(--gold)}
.rate button.on{background:var(--gold);color:#241a05}
textarea.field{width:100%;min-height:92px;resize:vertical;display:block}
input[type=date].field{width:100%;-webkit-appearance:none;min-height:44px}
.season{background:var(--s1);border-radius:var(--r);margin:8px 0;overflow:hidden}
.shead{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.shead .meta .bar{margin-top:6px}
.chk{width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:2px solid var(--s3);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:transparent}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.chk.part{border-color:var(--ok)}
.eps{border-top:1px solid var(--line)}
.ep{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ep:last-child{border-bottom:0}
.ep .n{width:30px;color:var(--mu);font-size:13px;font-weight:700;flex:0 0 auto}
.ep .meta .t{font-size:14px;font-weight:550;-webkit-line-clamp:1}
.ep.future{opacity:.45;cursor:default}
.muted{color:var(--mu);font-size:14px}
.small{font-size:12px;color:var(--mu2)}
.spin{padding:14px;color:var(--mu);font-size:14px}
.formrow{margin-bottom:14px}
.formrow label{display:block;font-size:13px;color:var(--mu);margin:0 0 6px 2px}
.formrow .field{width:100%}

/* stats */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--s1);border-radius:var(--r);padding:14px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--mu)}
.chart{background:var(--s1);border-radius:var(--r);padding:14px;margin-top:12px}
.chart h4{margin:0 0 12px;font-size:14px}
.cols{display:flex;align-items:flex-end;gap:5px;height:110px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.cols i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--gold);min-height:2px}
.cols.ep i{background:var(--ok)}
.cols.rt i{background:var(--rose)}
.cols span{font-size:10px;color:var(--mu2)}
.cols em{font-style:normal;font-size:10px;color:var(--mu)}
.hbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.hbar span:first-child{width:110px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .bar{flex:1;margin:0;height:8px}
.hbar .bar i{background:var(--gold)}
.hbar b{width:28px;text-align:right;font-size:13px;color:var(--mu)}

/* settings */
.panel{background:var(--s1);border-radius:var(--r);padding:16px;margin-top:14px}
.panel h3{margin:0 0 6px;font-size:17px}
.panel p{margin:0 0 12px;color:var(--mu);font-size:14px}
.panel .row{margin-top:10px}
.imp{display:flex;gap:10px;align-items:flex-start;padding:10px;background:var(--s1);border-radius:var(--r);margin:8px 0}
.imp.off{opacity:.5}
.imp .chk{margin-top:27px}
.imp .poster{width:48px;height:72px}
.sel{width:100%;padding:7px 10px;margin:4px 0 2px;font-weight:650;-webkit-appearance:none;appearance:none}
.lnk{color:var(--gold);font-size:13px;font-weight:650;margin-top:6px}
.foot{position:sticky;bottom:0;padding:14px 0 calc(8px + var(--safe-b));background:linear-gradient(rgba(20,17,28,0),var(--bg) 35%)}
.btn[disabled]{opacity:.4}
.egg{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(10,8,16,.75);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;transition:opacity .3s}
.egg.show{opacity:1}
.eggcard{max-width:420px;width:100%;max-height:80vh;overflow-y:auto;background:linear-gradient(160deg,#2c2242,#1b1726);border:1px solid rgba(255,196,64,.3);
  border-radius:22px;padding:26px 22px 20px;box-shadow:0 24px 70px rgba(0,0,0,.65);transform:scale(.9) translateY(10px);transition:transform .45s cubic-bezier(.2,.9,.3,1.25)}
.egg.show .eggcard{transform:none}
.eggtag{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.eggcard p{font-family:Georgia,"Times New Roman",serif;font-size:20px;line-height:1.55;font-style:italic;margin:0 0 20px;color:#f6f1fb}
.secret{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border-radius:10px;background:var(--s2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secret.lock{color:var(--mu2);letter-spacing:.25em;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,20px);opacity:0;z-index:60;background:#f3eff8;color:#14111c;
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-act="tab" data-tab="movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Filme</button>
  <button data-act="tab" data-tab="tv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M8 2l4 4 4-4"/></svg>Seriale</button>
  <button data-act="tab" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Caută</button>
  <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistici</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setări</button>
</nav>

<div id="sheet" aria-hidden="true"></div>
<div id="toast"></div>
<div id="egg" class="egg hide" data-act="eggClose"></div>
<input type="file" id="nfFile" accept=".csv,text/csv,text/comma-separated-values,text/plain" style="position:absolute;width:1px;height:1px;opacity:0;left:-10px;top:0">
<input type="file" id="restoreFile" accept="application/json,text/plain,.json,.txt" style="position:absolute;width:1px;height:1px;opacity:0;left:-10px;top:0">

<script>
'use strict';
/* ============================================================
   Filmele mele — jurnal personal de filme și seriale
   Date: localStorage (doar pe telefon) + backup în fișier
   Sursa datelor despre filme: TMDB (themoviedb.org)
   ============================================================ */

const APP_VERSION = '1.5';
const STORE_KEY = 'filme.v1';
const TMDB = 'https://api.themoviedb.org/3';
const IMG = (p, w = 'w185') => p ? `https://image.tmdb.org/t/p/${w}${p}` : '';
const BACKUP_DAYS = 7;

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = (s, opt = { day: 'numeric', month: 'short', year: 'numeric' }) => s ? new Date(s + 'T12:00:00').toLocaleDateString('ro-RO', opt) : '';
const cap = (s) => s ? s[0].toUpperCase() + s.slice(1) : s;
const initials = (t) => (t || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- date ---------- */
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && d.items) { d.settings = Object.assign({ tmdbKey: '', lastBackup: null }, d.settings); d.secrets = d.secrets || {}; return d; }
  } catch (e) {}
  return { v: 1, items: {}, settings: { tmdbKey: '', lastBackup: null }, secrets: {} };
}
let db = load();
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch (e) { toast('Nu am putut salva: memoria e plină'); }
}
const items = () => Object.values(db.items);
const touch = (it) => { it.updatedAt = Date.now(); };

/* ---------- TMDB ---------- */
const apiCache = new Map();
async function tmdb(path, params = {}) {
  const key = (db.settings.tmdbKey || '').trim();
  if (!key) throw new Error('NOKEY');
  const u = new URL(TMDB + path);
  u.searchParams.set('language', 'ro-RO');
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  const opt = { headers: { accept: 'application/json' } };
  if (key.length > 60) opt.headers.Authorization = 'Bearer ' + key; // API Read Access Token
  else u.searchParams.set('api_key', key);                            // API Key
  const ck = u.toString();
  if (apiCache.has(ck)) return apiCache.get(ck);
  const r = await fetch(u, opt);
  if (r.status === 401) throw new Error('BADKEY');
  if (!r.ok) throw new Error('HTTP' + r.status);
  const j = await r.json();
  apiCache.set(ck, j);
  return j;
}
async function getDetails(type, id) {
  const d = await tmdb(`/${type}/${id}`);
  if (!d.overview) {
    try { const en = await tmdb(`/${type}/${id}`, { language: 'en-US' }); d.overview = en.overview || ''; } catch (e) {}
  }
  return d;
}
function errMsg(e) {
  if (!navigator.onLine) return 'Ești offline.';
  if (e.message === 'NOKEY') return 'Adaugă cheia TMDB în Setări.';
  if (e.message === 'BADKEY') return 'Cheia TMDB nu e validă. Verific-o în Setări.';
  return 'Nu am putut contacta TMDB. Încearcă din nou.';
}

/* ---------- construire elemente ---------- */
function baseFromTmdb(type, d) {
  return {
    key: `${type}:${d.id}`, type, tmdbId: d.id,

function applyMovieMeta(it, d) {

/* ---------- logica serialelor ---------- */
function airedIn(it, n) {
  const s = (it.seasons || []).find((x) => x.n === n); if (!s) return 0;
  const la = it.lastAired;
  if (!la) return it.showStatus === 'Planned' || it.showStatus === 'In Production' ? 0 : s.count;
  if (n < la.s) return s.count;
  if (n === la.s) return Math.min(la.e, s.count);
  return 0;
}
const isW = (it, s, e) => !!(it.eps && it.eps[s] && it.eps[s][e]);
function seasonProg(it, n) {
  const a = airedIn(it, n); let w = 0;
  for (let e = 1; e <= a; e++) if (isW(it, n, e)) w++;
  return { w, a };
}
function tvProgress(it) {
  let w = 0, t = 0;
  for (const s of it.seasons || []) { const p = seasonProg(it, s.n); w += p.w; t += p.a; }
  return { w, t };
}

  let c = 0; for (const s in it.eps || {}) c += Object.keys(it.eps[s]).length; return c;
}

  for (const s of it.seasons || []) {
    const a = airedIn(it, s.n);

  }
  return null;
}
function setEp(it, s, e, on, date) {

}
function autoTvStatus(it) {

  if (p.w > 0 && it.status === 'watchlist') it.status = 'watching';
  const ended = it.showStatus === 'Ended' || it.showStatus === 'Canceled';
  if (p.t > 0 && p.w === p.t && ended && it.status === 'watching') it.status = 'completed';
  if (it.status === 'completed' && p.w < p.t) it.status = 'watching';
}

async function fetchSearch(page) {

      ${top.length ? `<div class="chart"><h4>Genuri preferate</h4>${top.map(([g, n]) => `<div class="hbar"><span>${esc(g)}</span><div class="bar"><i style="width:${n / gmx * 100}%"></i></div><b>${n}</b></div>`).join('')}</div>` : ''}

    l = l.trim(); if (!l || l.startsWith('#')) continue;
    l = l.replace(/^[*\-•]\s+/, '').replace(/^["„“”«']+/, '').replace(/["“”»']+$/, '').trim();
    if (!l) continue;
    const id = eggId(l); if (seen.has(id)) continue; seen.add(id);
    out.push({ id, text: l });
  }
  return out;
}
async function loadEggs() {
  try { const r = await fetch('secrete.txt', { cache: 'no-cache' }); if (r.ok) eggs = parseEggs(await r.text()); } catch (e) {}
  if (ui.tab === 'stats') renderList();
}
const eggFound = () => eggs.filter((e) => db.secrets[e.id]).length;
function maybeEgg() {
  if (!eggs.length || Math.random() >= EGG_CHANCE) return false;
  const fresh = eggs.filter((e) => !db.secrets[e.id]);
  const list = fresh.length ? fresh : eggs; // întâi cele negăsite
  const e = list[Math.floor(Math.random() * list.length)];
  const isNew = !db.secrets[e.id];
  if (isNew) { db.secrets[e.id] = today(); save(); }
  showEgg(e, isNew);
  return true;
}
function showEgg(e, isNew) {
  const el = $('#egg');
  $('#toast').classList.remove('show');
  const lines = e.text.split(/\s+\/\s+/).map(esc).join('<br>');
  el.innerHTML = `<div class="eggcard"><div class="eggtag">✦ ${isNew ? 'Secret nou găsit' : 'Secret'} · ${eggFound()}/${eggs.length}</div><p>${lines}</p><div class="small">Atinge oriunde ca să închizi</div></div>`;
  el.classList.remove('hide'); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
  if (ui.tab === 'stats') renderList();
}
function hideEgg() { const el = $('#egg'); el.classList.remove('show'); setTimeout(() => el.classList.add('hide'), 300); }
function secretsHtml() {
  if (!eggs.length) return '';
  const n = eggFound();
  return `<div class="chart"><h4>Secrete găsite · ${n}/${eggs.length}</h4>
    ${n ? '' : '<p class="small" style="margin:-4px 0 8px">Apar la întâmplare când folosești aplicația…</p>'}
    ${eggs.map((e) => db.secrets[e.id]
      ? `<button class="secret" data-act="eggOpen" data-id="${e.id}">✦ ${esc(e.text.split(/\s+\/\s+/)[0])}</button>`
      : `<div class="secret lock">? ? ?</div>`).join('')}</div>`;
}

/* ---------- evenimente ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = A[el.dataset.act]; if (f) f(el.dataset, el, e);
});
let noteT;
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  const v = e.target.value;
  if (k === 'filter') { ui.filter = v; renderList(); }
  else if (k === 'sq') { ui.sq = v; runSearch(); }
  else if (k === 'note') {
    const it = curItem(); if (!it) return;
    it.note = v; touch(it); clearTimeout(noteT); noteT = setTimeout(save, 400);
  }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  if (k === 'sort') { ui.sort = e.target.value; renderList(); }
  else if (k === 'date') { const it = curItem(); if (it) { it.watchedOn = e.target.value || null; touch(it); save(); } }
  else if (k === 'note') save();
  else if (k === 'impPick' && ctx && ctx.imp) {
    const g = ctx.imp.groups[e.target.dataset.i]; g.pick = Number(e.target.value); g.exact = true; g.include = true;
    if (g.kind === 'tv') { g.busy = true; renderSheet(); nfResolve(g).catch((er) => toast(errMsg(er))).finally(() => { g.busy = false; if (ctx && ctx.imp) renderSheet(); }); }
    else renderSheet();
  }
});
$('#nfFile').addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) nfStart(await f.text()); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.in === 'sq') { e.target.blur(); runSearch(0); }
  if (e.key === 'Escape' && ctx) closeSheet();
});
window.addEventListener('online', () => { if (ui.tab === 'search' && !ui.sRes) runSearch(0); });

/* ---------- pornire ---------- */
renderView();
loadEggs().then(() => setTimeout(maybeEgg, 700));
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 5 * 60 * 1000) maybeEgg(); // revenire în aplicație după 5+ minute
});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
